<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Marketing Assistant</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 16px;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: #6366f1;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #6366f1;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4f46e5;
        }

        #results {
            margin-top: 30px;
        }

        .idea {
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 15px;
        }

        .idea h3 {
            margin-bottom: 8px;
            color: #4f46e5;
        }

        .idea p {
            line-height: 1.6;
            color: #4b5563;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🤖 AI Marketing Assistant</h1>

        <p class="subtitle">
            Enter your product and generate three marketing ideas.
        </p>

        <label for="product">What are you marketing?</label>

        <textarea
            id="product"
            placeholder="Example: A new wireless Bluetooth speaker..."
        ></textarea>

        <button onclick="generateIdeas()">
            🚀 Generate Marketing Ideas
        </button>

        <div id="results" class="hidden">

            <div class="idea">
                <h3>💡 Marketing Idea 1</h3>
                <p id="idea1"></p>
            </div>

            <div class="idea">
                <h3>💡 Marketing Idea 2</h3>
                <p id="idea2"></p>
            </div>

            <div class="idea">
                <h3>💡 Marketing Idea 3</h3>
                <p id="idea3"></p>
            </div>

        </div>

    </div>

    <script>

        function generateIdeas() {

            const product = document.getElementById("product").value.trim();

            if (product === "") {
                alert("Please enter a product first.");
                return;
            }

            document.getElementById("idea1").textContent =
                `Create a short social media video showing how ${product} solves a common problem. Start with an attention-grabbing question and finish with a clear call to action.`;

            document.getElementById("idea2").textContent =
                `Launch a limited-time promotion for ${product}. Use urgency by highlighting that the offer is available for a short period, encouraging customers to take action quickly.`;

            document.getElementById("idea3").textContent =
                `Create a customer-focused campaign around ${product}. Ask customers to share how they would use it, then feature the best responses on your social media pages.`;

            document.getElementById("results").classList.remove("hidden");
        }

    </script>

</body>
</html>
